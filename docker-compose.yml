version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  users_service:
    image: niikyes/users-service:latest
    container_name: users-service
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
    ports:
      - "8000:8000"

  notifications_service:
    image: niikyes/notifications-service:latest
    container_name: notifications-service
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq


