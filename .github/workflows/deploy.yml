name: Build & Deploy Microservices to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Código
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Docker Hub login
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build & Push Users Service
      - name: Build & Push Users Service
        run: |
          cd users_service
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/users-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/users-service:latest
          cd ..

      # 4️⃣ Build & Push Notifications Service
      - name: Build & Push Notifications Service
        run: |
          cd notifications_service
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest
          cd ..

      # 5️⃣ Copiar docker-compose.yml existente a EC2
      - name: Copy Compose file to EC2
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ec2-user/docker-compose.yml"

      # 6️⃣ Desplegar en EC2 usando el Compose copiado
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🛑 Deteniendo y limpiando stack existente..."
            sudo docker-compose -f docker-compose.yml down || true
            sudo docker system prune -af || true

            echo "⬇️ Pull de imágenes más recientes..."
            sudo docker-compose -f docker-compose.yml pull

            echo "🚀 Levantando todo con Compose..."
            sudo docker-compose -f docker-compose.yml up -d

            echo "✅ Contenedores activos:"
            sudo docker ps

            echo "📜 Logs users-service (últimas 5 líneas):"
            sudo docker logs --tail 5 users-service || true

            echo "📜 Logs notifications-service (últimas 5 líneas):"
            sudo docker logs --tail 5 notifications-service || true





