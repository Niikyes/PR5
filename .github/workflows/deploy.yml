name: Build & Deploy Microservices to EC2

on:
  push:
    branches:
      - test    # Asegúrate de hacer git push origin test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Docker Hub login
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build & Push Users Service
      - name: Build & Push Users Service
        run: |
          cd users_service
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/users-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/users-service:latest
          cd ..

      # 4️⃣ Build & Push Notifications Service
      - name: Build & Push Notifications Service
        run: |
          cd notifications_service
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest
          cd ..

      # 5️⃣ Copiar docker-compose.yml a EC2 (target = directorio)
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          port: 22
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ec2-user/"    # <-- Directorio, no fichero


            # 6️⃣ Desplegar en EC2 usando el Compose copiado
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🛑 Deteniendo stack previo..."
            sudo docker-compose -f /home/ec2-user/docker-compose.yml down || true

            echo "🧹 Limpiando contenedores e imágenes huérfanas..."
            sudo docker system prune -af || true

            echo "⬇️ Pull de nuevas imágenes..."
            sudo docker-compose -f /home/ec2-user/docker-compose.yml pull

            echo "🚀 Levantando servicios..."
            sudo docker-compose -f /home/ec2-user/docker-compose.yml up -d

            echo "✅ Contenedores activos:"
            sudo docker ps

            echo "📜 Logs users-service (últimas 5 líneas):"
            sudo docker logs --tail 5 users-service || true

            echo "📜 Logs notifications-service (últimas 5 líneas):"
            sudo docker logs --tail 5 notifications-service || true






