name: Build, Push to Docker Hub & Deploy with Compose

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Login en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build y Push de Users Service
      - name: Build & Push Users Service
        run: |
          cd users_service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/users-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/users-service:latest
          cd ..

      # 4️⃣ Build y Push de Notifications Service
      - name: Build & Push Notifications Service
        run: |
          cd notifications_service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest
          cd ..

      # 5️⃣ Desplegar en EC2 con Docker Compose
      - name: Deploy to EC2 with Compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Instalando Docker Compose si es necesario..."
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose

            echo "⬇️ Creando archivo docker-compose.yml..."
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            services:
              rabbitmq:
                image: rabbitmq:3-management
                container_name: rabbitmq
                ports:
                  - "5672:5672"
                  - "15672:15672"
              users_service:
                image: ${{ secrets.DOCKER_USERNAME }}/users-service:latest
                container_name: users-service
                depends_on:
                  - rabbitmq
                ports:
                  - "8000:8000"
                environment:
                  - RABBITMQ_HOST=rabbitmq
              notifications_service:
                image: ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest
                container_name: notifications-service
                depends_on:
                  - rabbitmq
                environment:
                  - RABBITMQ_HOST=rabbitmq
            EOF

            echo "🛑 Deteniendo contenedores previos..."
            sudo docker-compose down || true

            echo "⬇️ Actualizando imágenes..."
            sudo docker-compose pull

            echo "🚀 Levantando stack..."
            sudo docker-compose up -d

            echo "✅ Estado final:"
            sudo docker ps

