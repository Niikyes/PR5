name: Build & Deploy Microservices to EC2

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Login en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build & Push: Users Service
      - name: Build & Push Users Service
        run: |
          cd users_service
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/users-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/users-service:latest
          cd ..

      # 4️⃣ Build & Push: Notifications Service
      - name: Build & Push Notifications Service
        run: |
          cd notifications_service
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest
          cd ..

      # 5️⃣ Deploy a EC2 con Docker Compose
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🛑 Limpiando contenedores e imágenes previas..."
            sudo docker-compose down || true
            sudo docker rm -f $(sudo docker ps -aq) || true
            sudo docker rmi -f $(sudo docker images -q) || true
            sudo docker system prune -af || true

            echo "📄 Generando docker-compose.yml..."
            cat > docker-compose.yml << 'EOF'
            version: '3.8'

            services:
              rabbitmq:
                image: rabbitmq:3-management
                container_name: rabbitmq
                ports:
                  - "5672:5672"
                  - "15672:15672"

              users_service:
                image: ${{ secrets.DOCKER_USERNAME }}/users-service:latest
                container_name: users-service
                depends_on:
                  - rabbitmq
                environment:
                  - RABBITMQ_HOST=rabbitmq
                ports:
                  - "8000:8000"

              notifications_service:
                image: ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest
                container_name: notifications-service
                depends_on:
                  - rabbitmq
                environment:
                  - RABBITMQ_HOST=rabbitmq
            EOF

            echo "⬇️ Descargando imágenes actualizadas..."
            sudo docker-compose pull

            echo "🚀 Levantando servicios en Compose..."
            sudo docker-compose up -d

            echo "✅ Contenedores activos:"
            sudo docker ps

            echo "📜 Últimos logs de notifications-service:"
            sudo docker logs --tail 10 notifications-service || true




