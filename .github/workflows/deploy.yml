name: Build, Push to Docker Hub & Deploy to EC2

on:
  push:
    branches:
      - test  # Se ejecuta en cada push a main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar repo temporalmente en el runner
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Login en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Construir y subir imagen Users Service (multi-stage optimizado)
      - name: Build & Push Users Service
        run: |
          cd users_service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/users-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/users-service:latest

      # 4️⃣ Construir y subir imagen Notifications Service
      - name: Build & Push Notifications Service
        run: |
          cd notifications_service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest

      # 5️⃣ Desplegar en EC2 automáticamente
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Deteniendo contenedores antiguos (si existen)..."
            sudo docker stop users-service notifications-service || true
            sudo docker rm users-service notifications-service || true

            echo "🧹 Limpiando imágenes antiguas (si existen)..."
            sudo docker rmi $(sudo docker images -q ${{ secrets.DOCKER_USERNAME }}/users-service) || true
            sudo docker rmi $(sudo docker images -q ${{ secrets.DOCKER_USERNAME }}/notifications-service) || true

            echo "⬇️ Descargando últimas imágenes desde Docker Hub..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/users-service:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest

            echo "🔄 Iniciando contenedores..."
            sudo docker run -d -p 8000:8000 --name users-service ${{ secrets.DOCKER_USERNAME }}/users-service:latest
            sudo docker run -d --name notifications-service ${{ secrets.DOCKER_USERNAME }}/notifications-service:latest

            echo "✅ Despliegue completado con éxito en EC2."
            sudo docker ps
